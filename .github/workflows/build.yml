
name: Build Nametag Studio

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Przygotuj Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12

      - name: Sprawdź i zbuduj moda
        run: gradle build --no-daemon

      - name: Prześlij plik JAR
        uses: actions/upload-artifact@v4
        with:
          name: NametagStudio-1.21.8
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
